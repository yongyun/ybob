    const eNext = (e + 1) % N;
    const sideVertexOffset = vertexOffset;

    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const u = (arcLengths[s] / totalArcLength) * textRepeatU;

      const center = curve.getPointAt(t);
      const N_vec = frames.normals[s];
      const B_vec = frames.binormals[s];
      const twistAngle = t * Math.PI * 2 * twistCount;
      const cosA = Math.cos(twistAngle);
      const sinA = Math.sin(twistAngle);
      const rN_x = N_vec.x * cosA + B_vec.x * sinA;
      const rN_y = N_vec.y * cosA + B_vec.y * sinA;
      const rN_z = N_vec.z * cosA + B_vec.z * sinA;
      const rB_x = -N_vec.x * sinA + B_vec.x * cosA;
      const rB_y = -N_vec.y * sinA + B_vec.y * cosA;
      const rB_z = -N_vec.z * sinA + B_vec.z * cosA;
      const wScale = widthEnvelope(t, wStart, wMid, wEnd);

      for (let d = 0; d <= subdiv; d++) {
        const u_val = u;
        const v_val = d / subdiv;

        const frac = d / subdiv;
        const px = (profilePts[e].x * (1 - frac) + profilePts[eNext].x * frac) * wScale;
        const py = (profilePts[e].y * (1 - frac) + profilePts[eNext].y * frac) * wScale;

        const x = center.x + px * rN_x + py * rB_x;
        const y = center.y + px * rN_y + py * rB_y;
        const z = center.z + px * rN_z + py * rB_z;

        positions.push(x, y, z);
        uvs.push(u_val, v_val);
      }
    }

    for (let s = 0; s < steps; s++) {
      for (let d = 0; d < subdiv; d++) {
        const row1 = sideVertexOffset + s * (subdiv + 1);
        const row2 = sideVertexOffset + (s + 1) * (subdiv + 1);

        const a = row1 + d;
        const b = row2 + d;
        const c = row2 + d + 1;
        const d_idx = row1 + d + 1;

        indices.push(a, c, b);
        indices.push(a, d_idx, c);
      }
    }

    vertexOffset += (steps + 1) * (subdiv + 1);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);

  geometry.computeVertexNormals();

  const indicesPerEdge = steps * subdiv * 6;
  for (let e = 0; e < N; e++) {
    geometry.addGroup(e * indicesPerEdge, indicesPerEdge, e);
  }

  return geometry;
}

// ============================================================
// PATH GENERATORS — use generic pathParam1-4 mapped to ranges
// ============================================================
function getPathPoints(preset) {
  const segments = 24;
  const params = getPathParams(preset);

  switch (preset) {
    case 'gentle-wave': {
      const [amp, width, cycles, depth] = params;
      const pts = [];
      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const x = (t - 0.5) * width;
        const angle = t * Math.PI * 2 * cycles;
        const y = Math.sin(angle) * amp;
        const z = Math.sin(angle * 0.7 + 0.5) * depth;
        pts.push(new THREE.Vector3(x, y, z));
      }
      return pts;
    }

    case 's-curve': {
      const [amp, width, depth] = params;
      const halfW = width / 2;
      return [
        new THREE.Vector3(-halfW, -amp, 0),
        new THREE.Vector3(-halfW * 0.5, amp, depth),
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(halfW * 0.5, -amp, -depth),
        new THREE.Vector3(halfW, amp, 0),
      ];
    }

    case 'helix': {
      const [height, turns, startR, endR] = params;
      const pts = [];
      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const angle = t * Math.PI * 2 * turns;
        const r = startR + (endR - startR) * t;
        pts.push(new THREE.Vector3(
          (t - 0.5) * height,
          Math.sin(angle) * r,
          Math.cos(angle) * r
        ));
      }
      return pts;
    }

    case 'spiral': {
      const [turns, startR, endR, height] = params;
      const pts = [];
      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const angle = t * Math.PI * 2 * turns;
        const r = startR + (endR - startR) * t;
        pts.push(new THREE.Vector3(
          Math.cos(angle) * r,
          (t - 0.5) * height,
          Math.sin(angle) * r
        ));
      }
      return pts;
    }

    case 'circle': {
      const [radius] = params;
      const pts = [];
      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const angle = t * Math.PI * 2 * 0.95;
        pts.push(new THREE.Vector3(
          Math.cos(angle) * radius,
          0,
          Math.sin(angle) * radius
        ));
      }
      return pts;
    }

    case 'loop': {
      const [radius, loopH, loopW] = params;
      const halfW = loopW / 2;
      return [
        new THREE.Vector3(-halfW, 0, 0),
        new THREE.Vector3(-halfW * 0.4, loopH, radius),
        new THREE.Vector3(halfW * 0.2, loopH * 1.5, 0),
        new THREE.Vector3(halfW * 0.6, loopH, -radius),
        new THREE.Vector3(halfW * 0.4, -loopH * 0.3, 0),
        new THREE.Vector3(-halfW * 0.2, -loopH * 0.7, radius),
        new THREE.Vector3(-halfW * 0.7, 0, 0),
      ];
    }

    default:
      return getPathPoints('gentle-wave');
  }
}

// ============================================================
// CANVAS TEXTURE GENERATOR
// ============================================================
function createTickerTexture(text, fontSize, textColor, bgColor) {
  const offCanvas = document.createElement('canvas');
  const offCtx = offCanvas.getContext('2d');

  const font = `bold ${fontSize}px "Helvetica Neue", Arial, sans-serif`;
  offCtx.font = font;
  const textWidth = offCtx.measureText(text).width;
  const metrics = offCtx.measureText(text);

  const repeats = Math.max(3, Math.ceil(8192 / textWidth));
  const canvasWidth = Math.min(16384, Math.ceil(textWidth * repeats));
  const ascent = metrics.actualBoundingBoxAscent || fontSize * 0.8;
  const descent = metrics.actualBoundingBoxDescent || fontSize * 0.2;
  const textHeight = Math.ceil(ascent + descent);
  const canvasHeight = Math.max(textHeight, fontSize);

  offCanvas.width = canvasWidth;
  offCanvas.height = canvasHeight;

  offCtx.fillStyle = bgColor;
  offCtx.fillRect(0, 0, canvasWidth, canvasHeight);

  offCtx.font = font;
  offCtx.fillStyle = textColor;
  offCtx.textBaseline = 'alphabetic';
  offCtx.textAlign = 'left';

  const yBaseline = ascent;
  for (let i = 0; i < repeats + 1; i++) {
    offCtx.fillText(text, i * textWidth, yBaseline);
  }

  const texture = new THREE.CanvasTexture(offCanvas);
  texture.flipY = false;
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.ClampToEdgeWrapping;
  texture.minFilter = THREE.LinearMipmapLinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

  return texture;
}

function createPerSideTextures(text, fontSize, textColors, sideColors) {
  return sideColors.map((bgColor, i) => createTickerTexture(text, fontSize, textColors[i], bgColor));
}

// ============================================================
// MESH BUILDER
// ============================================================
let tickerMesh = null;
let tickerTextures = [];
let currentSideFlipU = [];
// Cached data for twist animation (avoids full rebuild each frame)
let cachedCurve = null;
let cachedProfilePts = null;
let cachedSteps = 0;
let cachedTwistCount = 0;
let cachedWStart = 1;
let cachedWMid = 1;
let cachedWEnd = 1;
let cachedSubdiv = 1;

function updateTwistVertices(geometry, curve, profilePts, steps, baseTwist, twistOffset, wStart, wMid, wEnd, subdiv) {
  const N = profilePts.length;
  const frames = curve.computeFrenetFrames(steps, false);
  const posArr = geometry.attributes.position.array;
  let vi = 0;

  for (let e = 0; e < N; e++) {
    const eNext = (e + 1) % N;
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const center = curve.getPointAt(t);
      const N_vec = frames.normals[s];
      const B_vec = frames.binormals[s];
      const twistAngle = t * Math.PI * 2 * (baseTwist + twistOffset);
      const cosA = Math.cos(twistAngle);
      const sinA = Math.sin(twistAngle);
      const rN_x = N_vec.x * cosA + B_vec.x * sinA;
      const rN_y = N_vec.y * cosA + B_vec.y * sinA;
      const rN_z = N_vec.z * cosA + B_vec.z * sinA;
      const rB_x = -N_vec.x * sinA + B_vec.x * cosA;
      const rB_y = -N_vec.y * sinA + B_vec.y * cosA;
      const rB_z = -N_vec.z * sinA + B_vec.z * cosA;
      const wScale = widthEnvelope(t, wStart, wMid, wEnd);

      for (let d = 0; d <= subdiv; d++) {
        const frac = d / subdiv;
        const px = (profilePts[e].x * (1 - frac) + profilePts[eNext].x * frac) * wScale;
        const py = (profilePts[e].y * (1 - frac) + profilePts[eNext].y * frac) * wScale;

        posArr[vi * 3] = center.x + px * rN_x + py * rB_x;
        posArr[vi * 3 + 1] = center.y + px * rN_y + py * rB_y;
        posArr[vi * 3 + 2] = center.z + px * rN_z + py * rB_z;
        vi++;
      }
    }
  }
  geometry.attributes.position.needsUpdate = true;
  geometry.computeVertexNormals();
}

function disposeMesh() {
  if (tickerMesh) {
    scene.remove(tickerMesh);
    tickerMesh.geometry.dispose();
    if (Array.isArray(tickerMesh.material)) {
      tickerMesh.material.forEach(m => m.dispose());
    } else {
      tickerMesh.material.dispose();
    }
    tickerMesh = null;
  }
  tickerTextures.forEach(t => t.dispose());
  tickerTextures = [];
}

function getSideColors(numSides) {
  const palette = [
    controls.get('sideColor1'),
    controls.get('sideColor2'),
    controls.get('sideColor3'),
    controls.get('sideColor4'),
  ];
  const colors = [];
  for (let i = 0; i < numSides; i++) {
    colors.push(palette[i % palette.length]);
  }
  return colors;
}

function getTextColors(numSides) {
  const palette = [
    controls.get('textColor1'),
    controls.get('textColor2'),
    controls.get('textColor3'),
    controls.get('textColor4'),
  ];
  const colors = [];
  for (let i = 0; i < numSides; i++) {
    colors.push(palette[i % palette.length]);
  }
  return colors;
}

function buildTickerMesh() {
  disposeMesh();

  const profileType = controls.get('profileShape');
  const profileScale = controls.get('profileScale');
  const pathPreset = controls.get('pathPreset');
  const twistCount = controls.get('twistCount');
  const pathSteps = controls.get('pathSteps');
  const tickerText = controls.get('tickerText') || 'TICKER TEXT \\u2605 ';
  const fontSize = controls.get('fontSize');
  const textureStretch = controls.get('textureStretch');

  const curve = new THREE.CatmullRomCurve3(getPathPoints(pathPreset), false, 'catmullrom', 0.5);
  const profilePts = getProfilePoints(profileType, profileScale);
  const numSides = profilePts.length;

  // Cache for twist animation
  cachedCurve = curve;
  cachedProfilePts = profilePts;
  cachedSteps = pathSteps;
  cachedTwistCount = twistCount;
  cachedWStart = controls.get('widthStart');
  cachedWMid = controls.get('widthMid');
  cachedWEnd = controls.get('widthEnd');
  cachedSubdiv = controls.get('sideSubdivisions');

  const wStart = controls.get('widthStart');
  const wMid = controls.get('widthMid');
  const wEnd = controls.get('widthEnd');
  const sideSubdivisions = controls.get('sideSubdivisions');
  const geometry = buildSweptGeometry(curve, profilePts, pathSteps, twistCount, textureStretch, wStart, wMid, wEnd, sideSubdivisions);

  const sideColors = getSideColors(numSides);
  const textColors = getTextColors(numSides);
  tickerTextures = createPerSideTextures(tickerText, fontSize, textColors, sideColors);

  const wireframe = controls.get('wireframe');
  const materialType = controls.get('materialType');
  const roughness = controls.get('roughness') / 100;
  const metalness = controls.get('metalness') / 100;
  const emissiveIntensity = controls.get('emissiveIntensity');

  const materials = tickerTextures.map((tex, i) => {
    const sideColor = sideColors[i] || '#1a1a2e';

    if (materialType === 'emissive') {
      return new THREE.MeshBasicMaterial({
        map: tex,
        side: THREE.DoubleSide,
        wireframe: wireframe,
        toneMapped: false,
      });
    } else if (materialType === 'glossy') {
      return new THREE.MeshPhysicalMaterial({
        map: tex,
        roughness: roughness,
        metalness: metalness,
        clearcoat: 1.0,
        clearcoatRoughness: roughness * 0.5,
        reflectivity: 1.0,
        emissive: new THREE.Color(sideColor),
        emissiveIntensity: emissiveIntensity * 0.3,
        side: THREE.DoubleSide,
        wireframe: wireframe,
      });
    } else {
      return new THREE.MeshStandardMaterial({
        map: tex,
        roughness: roughness,
        metalness: metalness,
        emissive: new THREE.Color(sideColor),
        emissiveIntensity: emissiveIntensity * 0.15,
        side: THREE.DoubleSide,
        wireframe: wireframe,
      });
    }
  });

  tickerMesh = new THREE.Mesh(geometry, materials);

  tickerMesh.rotation.x = THREE.MathUtils.degToRad(controls.get('pathRotX'));
  tickerMesh.rotation.y = THREE.MathUtils.degToRad(controls.get('pathRotY'));
  tickerMesh.rotation.z = THREE.MathUtils.degToRad(controls.get('pathRotZ'));

  scene.add(tickerMesh);
}

function rebuildTexture() {
  if (!tickerMesh) return;

  const tickerText = controls.get('tickerText') || 'TICKER TEXT \\u2605 ';
  const fontSize = controls.get('fontSize');
  const profileType = controls.get('profileShape');
  const profileScale = controls.get('profileScale');
  const numSides = getProfilePoints(profileType, profileScale).length;
  const sideColors = getSideColors(numSides);
  const textColors = getTextColors(numSides);

  tickerTextures.forEach(t => t.dispose());
  tickerTextures = createPerSideTextures(tickerText, fontSize, textColors, sideColors);

  if (Array.isArray(tickerMesh.material)) {
    tickerMesh.material.forEach((mat, i) => {
      if (i < tickerTextures.length) {
        mat.map = tickerTextures[i];
        mat.needsUpdate = true;
      }
    });
  }
}

// ============================================================
// DYNAMIC LABEL + VISIBILITY UPDATES
// ============================================================
function onPathPresetChange(newPreset) {
  const defs = pathParamDefs[newPreset];
  if (!defs) return;

  updateLegend(newPreset);
  lastPreset = newPreset;
}

// ============================================================
// CONTROL CHANGE ROUTING
// ============================================================
const geometryKeys = new Set([
  'profileShape', 'profileScale', 'pathPreset', 'twistCount', 'pathSteps', 'textureStretch',
  'widthStart', 'widthMid', 'widthEnd',
  'pathParam1', 'pathParam2', 'pathParam3', 'pathParam4',
  'materialType', 'sideSubdivisions',
]);
const textureKeys = new Set(['tickerText', 'fontSize', 'textColor', 'sideColor1', 'sideColor2', 'sideColor3', 'sideColor4']);
const materialPropKeys = new Set(['roughness', 'metalness', 'emissiveIntensity']);
const orientationKeys = new Set(['pathRotX', 'pathRotY', 'pathRotZ']);

controls.onAny((key, value) => {
  if (key === 'pathPreset') {
    onPathPresetChange(value);
  }
  if (geometryKeys.has(key)) {
    buildTickerMesh();
  } else if (textureKeys.has(key)) {
    rebuildTexture();
  } else if (materialPropKeys.has(key) && tickerMesh) {
    const materialType = controls.get('materialType');
    const r = controls.get('roughness') / 100;
    const m = controls.get('metalness') / 100;
    const ei = controls.get('emissiveIntensity');
    if (Array.isArray(tickerMesh.material)) {
      tickerMesh.material.forEach(mat => {
        if (materialType !== 'emissive') {
          mat.roughness = r;
          mat.metalness = m;
          if (mat.emissiveIntensity !== undefined) {
            mat.emissiveIntensity = materialType === 'glossy' ? ei * 0.3 : ei * 0.15;
          }
          if (mat.clearcoatRoughness !== undefined) {
            mat.clearcoatRoughness = r * 0.5;
          }
        }
        mat.needsUpdate = true;
      });
    }
  } else if (orientationKeys.has(key) && tickerMesh) {
    tickerMesh.rotation.x = THREE.MathUtils.degToRad(controls.get('pathRotX'));
    tickerMesh.rotation.y = THREE.MathUtils.degToRad(controls.get('pathRotY'));
    tickerMesh.rotation.z = THREE.MathUtils.degToRad(controls.get('pathRotZ'));
  } else if (key === 'wireframe' && tickerMesh) {
    if (Array.isArray(tickerMesh.material)) {
      tickerMesh.material.forEach(m => m.wireframe = value);
    } else {
      tickerMesh.material.wireframe = value;
    }
  }
});

controls.onAction('rebuild', () => {
  buildTickerMesh();
});

// ============================================================
// ANIMATION LOOP
// ============================================================
function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const playing = controls.get('playing');

  const lightIntensity = controls.get('lightIntensity');
  dirLight1.intensity = lightIntensity;
  dirLight2.intensity = lightIntensity * 0.5;
  pointLight.intensity = lightIntensity * 0.75;

  const cameraOrbit = controls.get('cameraOrbit');
  const cameraOrbitSpeed = controls.get('cameraOrbitSpeed');
  orbitControls.autoRotate = cameraOrbit && playing;
  orbitControls.autoRotateSpeed = cameraOrbitSpeed * 2;

  const meshRotateSpeed = controls.get('meshRotateSpeed');
  if (tickerMesh && playing && meshRotateSpeed > 0) {
    tickerMesh.rotation.y += delta * meshRotateSpeed * 0.5;
  }

  if (tickerTextures.length > 0 && playing) {
    const scrollSpeed = controls.get('scrollSpeed');
    const offsetDelta = delta * scrollSpeed * 0.2;
    tickerTextures.forEach((tex) => {
      tex.offset.x -= offsetDelta;
    });
  }

  const twistAnimate = controls.get('twistAnimate');
  if (twistAnimate && playing && tickerMesh && cachedCurve) {
    const twistAnimSpeed = controls.get('twistAnimSpeed');
    twistAnimOffset += delta * twistAnimSpeed * 0.3;
    updateTwistVertices(
      tickerMesh.geometry, cachedCurve, cachedProfilePts,
      cachedSteps, cachedTwistCount, twistAnimOffset,
      cachedWStart, cachedWMid, cachedWEnd, cachedSubdiv
    );
  }

  orbitControls.update();
  renderer.render(scene, camera);
}

// ============================================================
// RESIZE HANDLER
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = area.clientWidth / area.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(area.clientWidth, area.clientHeight);
});

// ============================================================
// INITIAL BUILD & START
// ============================================================
lastPreset = controls.get('pathPreset');
updateLegend(lastPreset);

buildTickerMesh();
animate();

    // System Background Wiring
    if (typeof CanvasRuntimeAPI !== 'undefined') {
      var __sysBgVal = controls.get('__sys_bg');
      if (__sysBgVal) CanvasRuntimeAPI.setBackground(__sysBgVal);
    }
  </script>
